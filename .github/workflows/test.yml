name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in lib/*.js content/*.js background/*.js popup/*.js; do node --check "$f"; done
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - name: Unit tests
        run: node --test tests/*.test.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.*
      - run: python -m playwright install --with-deps chromium
      - name: End-to-end (Chromium + fake x.com / instagram.com)
        run: python tests/e2e/run_e2e.py --screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-screenshots
          path: screenshots/
